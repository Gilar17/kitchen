<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крестики-нолики</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --cell: #334155;
      --cell-hover: #475569;
      --accent: #38bdf8;
      --win: #16a34a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --shadow: rgba(2, 6, 23, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(92vw, 430px);
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 28px;
      background: rgba(30, 41, 59, 0.92);
      box-shadow: 0 30px 90px var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
    }

    .status {
      min-height: 1.7rem;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 20px;
      background: var(--cell);
      color: var(--text);
      font-size: clamp(3rem, 18vw, 5rem);
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .cell:hover:not(:disabled),
    .cell:focus-visible:not(:disabled) {
      transform: translateY(-3px);
      background: var(--cell-hover);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.32);
      outline: 3px solid rgba(56, 189, 248, 0.55);
      outline-offset: 3px;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.win {
      background: var(--win);
    }

    .actions {
      display: flex;
      justify-content: center;
    }

    .reset {
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      background: var(--accent);
      color: #082f49;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease;
    }

    .reset:hover,
    .reset:focus-visible {
      transform: translateY(-2px);
      background: #7dd3fc;
      outline: 3px solid rgba(125, 211, 252, 0.45);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Игра Крестики-нолики">
    <h1>Крестики-нолики</h1>
    <p class="status" id="status" role="status" aria-live="polite">Ход игрока X</p>
    <div class="board" id="board" role="grid" aria-label="Игровое поле"></div>
    <div class="actions">
      <button class="reset" id="reset" type="button">Новая игра</button>
    </div>
  </main>

  <script>
    const players = ['X', 'O'];
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const boardElement = document.querySelector('#board');
    const statusElement = document.querySelector('#status');
    const resetButton = document.querySelector('#reset');
    const board = Array(9).fill('');
    const cells = [];

    let currentPlayer = players[0];
    let gameOver = false;

    function findWinningLine() {
      return winningLines.find(([a, b, c]) => (
        board[a] && board[a] === board[b] && board[a] === board[c]
      ));
    }

    function updateStatus(message) {
      statusElement.textContent = message || `Ход игрока ${currentPlayer}`;
    }

    function render(winningLine = []) {
      cells.forEach((cell, index) => {
        cell.textContent = board[index];
        cell.disabled = gameOver || Boolean(board[index]);
        cell.classList.toggle('win', winningLine.includes(index));
        cell.setAttribute(
          'aria-label',
          board[index] ? `Клетка ${index + 1}: ${board[index]}` : `Клетка ${index + 1}: пусто`
        );
      });
    }

    function makeMove(index) {
      if (gameOver || board[index]) {
        return;
      }

      board[index] = currentPlayer;
      const winningLine = findWinningLine();

      if (winningLine) {
        gameOver = true;
        updateStatus(`Победил игрок ${currentPlayer}!`);
        render(winningLine);
        return;
      }

      if (board.every(Boolean)) {
        gameOver = true;
        updateStatus('Ничья!');
        render();
        return;
      }

      currentPlayer = currentPlayer === players[0] ? players[1] : players[0];
      updateStatus();
      render();
    }

    function resetGame() {
      board.fill('');
      currentPlayer = players[0];
      gameOver = false;
      updateStatus();
      render();
    }

    for (let index = 0; index < board.length; index += 1) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('role', 'gridcell');
      cell.addEventListener('click', () => makeMove(index));
      cells.push(cell);
      boardElement.append(cell);
    }

    resetButton.addEventListener('click', resetGame);
    render();
  </script>
</body>
</html>
